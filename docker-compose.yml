services:
  chatbot:
    build: ./api
    container_name: match-chatbot-api
    ports:
      - "3000:3000"
    env_file:
      - ./api/.env
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres-chatbot-primary:5432/chatbot
      - DATABASE_REPLICA_URL=postgresql://postgres:postgrespassword@postgres-chatbot-primary:5432/chatbot
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - redis
      - postgres-chatbot-primary
      - postgres-chatbot-replica
    restart: unless-stopped

  frontend:
    mem_limit: 768m
    cpus: 0.3
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: 768M
    build:
      context: ./service-app
    ports:
      - "3001:3001"
    env_file:
      - ./service-app/.env
    environment:
      - INTERNAL_BACKEND_URL=http://chatbot:3000
    depends_on:
      - chatbot
    restart: unless-stopped

  web:
    container_name: match-chatbot-web
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "3002:80"
    restart: unless-stopped

  postgres-chatbot-primary:
    image: postgres:15-alpine
    container_name: match_postgres_chatbot_primary
    environment:
      - POSTGRES_PASSWORD=postgrespassword
      - POSTGRES_USER=postgres
      - POSTGRES_DB=chatbot
      - POSTGRES_INITDB_ARGS=--data-checksums
    ports:
      - "127.0.0.1:5434:5432"
    command: >
      postgres
      -c wal_level=replica
      -c max_wal_senders=10
    volumes:
      - polls_pg_primary_data:/var/lib/postgresql/data
      - ./init-primary.sh:/docker-entrypoint-initdb.d/init-primary.sh
    restart: unless-stopped

  postgres-chatbot-replica:
    image: postgres:15-alpine
    container_name: match_postgres_chatbot_replica
    environment:
      - PGDATA=/var/lib/postgresql/data
      - POSTGRES_PASSWORD=docker
    ports:
      - "127.0.0.1:5435:5432" # Slave/Replica na porta 5435 externa
    volumes:
      - polls_pg_replica_data:/var/lib/postgresql/data
      - ./entrypoint-replica.sh:/entrypoint-replica.sh
    entrypoint: ["/bin/sh", "/entrypoint-replica.sh"]
    command: ["postgres"]
    depends_on:
      - postgres-chatbot-primary
    restart: unless-stopped

  redis:
    image: bitnami/redis:latest
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    ports:
      - "127.0.0.1:6379:6379" # Bind apenas no localhost por segurança
    volumes:
      - polls_redis_data:/bitnami/redis/data
    restart: unless-stopped

  postgres-general:
    image: postgres:15-alpine
    container_name: match_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_MULTIPLE_DATABASES: motoboys,evolution
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Script customizado para criar multiplas bases ao subir
      - ./init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh
    ports:
      - "5432:5432"

  evolution:
    image: evoapicloud/evolution-api:latest
    container_name: match_evolution
    restart: always
    volumes:
      - evolution_instances:/evolution/instances
    environment:
      - SERVER_URL=http://localhost:8080
      - LOG_LEVEL=ERROR,WARN,DEBUG,INFO,LOG,VERBOSE,FATAL
      - WPP_LID_MODE=false
      - WEBSOCKET_ENABLED=true
      - WEBSOCKET_GLOBAL_EVENTS=true
      - WEBSOCKET_ALLOWED_HOSTS=*
      - CORS_ORIGIN=*
      - CORS_METHODS=POST,GET,PUT,DELETE
      - CORS_CREDENTIALS=true
      - PORT=8080
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=apitestkey
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://postgres:postgrespassword@postgres-general:5432/evolution?schema=public
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_DATA_WEBHOOK=true
      - DATABASE_SAVE_DATA_CONTACTS=true
      - DATABASE_SAVE_DATA_CHATS=true
      - REDIS_ENABLED=true
      - REDIS_URI=redis://redis:6379
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379/0
      - CACHE_REDIS_PREFIX_KEY=evolution
      - CACHE_REDIS_SAVE_INSTANCES=true
      - CACHE_LOCAL_ENABLED=false
    ports:
      - "8080:8080"
    depends_on:
      - postgres-general
      - redis

  motoboys:
    build: ./motoboys
    container_name: match-chatbot-motoboys
    ports:
      - "3003:3000"
    env_file:
      - ./motoboys/.env
    environment:
      - REDIS_URL=redis://redis:6379
      - EVOLUTION_API_URL=http://evolution:8080
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres-general:5432/motoboys
      - PORT=3000
    depends_on:
      - redis
      - postgres-general
      - evolution
    restart: unless-stopped

volumes:
  polls_pg_primary_data:
  polls_pg_replica_data:
  postgres_data:
  polls_redis_data:
  uploads_data:
  evolution_instances:
